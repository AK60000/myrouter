name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build myrouter.slnx -c Release

      - name: Smoke test (mock upstream, no network)
        run: dotnet run --project tests/myrouter.SmokeTest -c Release
