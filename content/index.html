<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myrouter</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/md/katex.css">
<style>
  :root {
    --bg: #0f1115;
    --bg-grad: radial-gradient(1200px 600px at 15% -10%, #16202b 0%, #0f1115 55%);
    --panel: #161a21;
    --panel-2: #1c222c;
    --border: rgba(255, 255, 255, .08);
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #00a7e6;
    --user-bubble: #14532d33;         /* 用户气泡：暗绿染 */
    --user-border: rgba(34, 197, 94, .28);
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── 顶栏 ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(18, 21, 28, .72);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  header .logo { width: 30px; height: 30px; border-radius: 8px; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 9px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    user-select: none;
  }
  .btn:hover { border-color: rgba(255, 255, 255, .18); background: #232a36; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, #00a7e6, #0077c8); border: none; color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }

  /* ── 模型选择条 ── */
  .modelBar {
    max-width: 780px; margin: 0 auto 8px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text-dim);
  }
  .modelBar select {
    flex: 1; max-width: 420px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; outline: none;
  }
  .modelBar select:focus { border-color: rgba(0, 167, 230, .55); }
  .modelBar .hint { font-size: 12px; }

  /* ── 消息区 ── */
  main { flex: 1; overflow-y: auto; padding: 24px 20px; scroll-behavior: smooth; }
  .msgWrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; gap: 12px; animation: rise .22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: rgba(34, 197, 94, .16); color: #4ade80; }
  .msg.ai .avatar { background: rgba(0, 167, 230, .16); color: #38bdf8; }
  .bubble {
    max-width: min(72%, 560px);
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--user-border);
    border-top-right-radius: 4px;
    /* 用户消息是纯文本（markdown 渲染只作用于 AI 侧），保留原始换行 */
    white-space: pre-wrap;
  }
  .msg.ai .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    /* 固定宽度：fit-content 会因 overflow-x:auto 的 pre 不贡献溢出宽度而收缩，
       导致代码块横向滚动、流式过程宽度抖动（表现为"内容越来越靠右"） */
    width: min(72%, 560px);
  }
  .bubble img { max-width: 100%; border-radius: 8px; display: block; margin: 6px 0; }
  .bubble :is(code, pre) { font-family: Consolas, monospace; font-size: 13px; }
  .bubble code { background: rgba(255, 255, 255, .09); padding: 1px 5px; border-radius: 4px; }
  .bubble pre { background: #0b0e13; border: 1px solid var(--border); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; }
  .bubble pre code { background: none; padding: 0; }
  .bubble p { margin: 4px 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 { margin: 10px 0 4px; line-height: 1.35; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 22px; }
  .bubble blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--text-dim); }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble a { color: var(--accent); }
  .bubble table { border-collapse: collapse; margin: 6px 0; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 10px; }
  /* 思维链折叠块 */
  .bubble details.think {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255, 255, 255, .03);
    padding: 6px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .bubble details.think summary {
    cursor: pointer; user-select: none;
    color: var(--text-dim); font-size: 12.5px;
    list-style: none;
  }
  .bubble details.think summary::-webkit-details-marker { display: none; }
  .bubble details.think summary::before { content: "▸ "; }
  .bubble details.think[open] summary::before { content: "▾ "; }
  .bubble details.think .thinkBody { margin-top: 8px; color: var(--text-dim); }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .err .bubble, .bubble.err { border-color: rgba(248, 113, 113, .4); color: var(--danger); }
  .empty { color: var(--text-dim); text-align: center; margin-top: 18vh; font-size: 13.5px; line-height: 2; }
  .empty .k { display: inline-block; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; margin: 0 2px; }

  /* ── 输入区 ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 14px 20px 18px;
    background: rgba(15, 17, 21, .85);
    backdrop-filter: blur(8px);
  }
  .composer {
    max-width: 780px; margin: 0 auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: rgba(0, 167, 230, .55); }
  #input {
    width: 100%;
    background: none; border: none; outline: none;
    color: var(--text);
    font: inherit; font-size: 14.5px; line-height: 1.6;
    resize: none; max-height: 180px;
    min-height: 24px;
    padding: 2px 2px 8px;
  }
  #input::placeholder { color: var(--text-dim); }
  .composerRow { display: flex; align-items: center; gap: 8px; }
  .composerRow .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--text-dim); }
  .hint.toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .hint.toggle input { accent-color: var(--accent); margin: 0; }
  .files { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 8px; }
  .fileChip {
    display: flex; align-items: center; gap: 8px;
    background: #10141b; border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 12px;
    max-width: 260px;
  }
  .fileChip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fileChip .thumb { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; }
  .fileChip .rm { cursor: pointer; color: var(--text-dim); padding: 0 4px; }
  .fileChip .rm:hover { color: var(--danger); }

  /* ── 用户画像面板 ── */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .panel {
    width: min(640px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
  }
  .panel h2 { margin: 0 0 6px; font-size: 16px; }
  .panel .desc { margin: 0 0 14px; font-size: 13px; color: var(--text-dim); line-height: 1.7; }
  .panel .desc code {
    background: rgba(255, 255, 255, .09); padding: 1px 5px; border-radius: 4px; font-size: 12px;
  }
  .panel textarea {
    width: 100%; min-height: 180px; max-height: 45vh;
    background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font: inherit; font-size: 13.5px; line-height: 1.6;
    padding: 10px 12px; resize: vertical; outline: none;
  }
  .panel textarea:focus { border-color: rgba(0, 167, 230, .55); }
  .panel .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .panel .row .spacer { flex: 1; }
  .panel .note { font-size: 12.5px; color: var(--text-dim); margin-top: 10px; line-height: 1.7; }
  .panel .note.ok { color: #4ade80; }
  .panel .note.err { color: var(--danger); }

  /* ── JS 代码块运行 ── */
  .codeWrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 8px 0; }
  .codeWrap pre { border: none; border-radius: 0; margin: 0; }
  .codeWrap .runCode {
    width: 100%; border: none; border-top: 1px solid var(--border);
    background: var(--panel-2); color: var(--text);
    padding: 6px; font-size: 12.5px; cursor: pointer;
  }
  .codeWrap .runCode:hover:not(:disabled) { background: #232a36; }
  .codeWrap .runCode:disabled { opacity: .5; cursor: wait; }
  .codeOut {
    padding: 8px 12px; font-family: Consolas, monospace; font-size: 12.5px;
    border-top: 1px solid var(--border); white-space: pre-wrap; word-break: break-all;
    color: var(--text-dim); line-height: 1.6;
  }
  .codeOut.ok { color: var(--text); }
  .codeOut.err { color: var(--danger); }

  /* ── 代码运行输出（自动注入的中间消息）：提示样式而非用户气泡 ── */
  .msg.sys { justify-content: center; }
  .msg.sys .avatar { display: none; }
  .msg.sys .bubble {
    background: none; border: 1px dashed var(--border);
    max-width: 90%; font-size: 12.5px; color: var(--text-dim);
    white-space: pre-wrap; padding: 8px 12px;
  }

  /* ── 工具调用步骤（run_javascript）：AI 主动调用的代码执行块 ── */
  .toolCall {
    border: 1px dashed rgba(255, 255, 255, .2);
    border-radius: 8px;
    margin: 8px 0;
    overflow: hidden;
  }
  .toolCall .toolTitle {
    font-size: 11px; color: var(--text-dim);
    padding: 4px 10px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, .03);
  }
  .toolCall pre {
    border: none; border-radius: 0; margin: 0;
    border-bottom: 1px solid var(--border);
    max-height: 260px;
  }
  .toolCall .codeOut { border-top: none; }

  /* ── highlight.js github-dark 配色（本地内嵌，仅作用于代码高亮 span） ── */
  .hljs-comment, .hljs-quote { color: #8b949e; }
  .hljs-keyword, .hljs-selector-tag, .hljs-subst { color: #ff7b72; }
  .hljs-number, .hljs-literal, .hljs-variable, .hljs-template-variable, .hljs-tag .hljs-attr { color: #79c0ff; }
  .hljs-string, .hljs-doctag { color: #a5d6ff; }
  .hljs-title, .hljs-section, .hljs-selector-id { color: #d2a8ff; }
  .hljs-type, .hljs-class .hljs-title, .hljs-attr { color: #ffa657; }
  .hljs-built_in, .hljs-symbol, .hljs-bullet, .hljs-code, .hljs-addition { color: #7ee787; }
  .hljs-meta, .hljs-deletion { color: #ffa198; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }

  /* ── 会话侧栏 ── */
  .btn.icon { padding: 7px 10px; }
  .mid { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 260px; flex: none;
    border-right: 1px solid var(--border);
    background: rgba(13, 16, 21, .55);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: margin-left .2s ease;
  }
  .sidebar.collapsed { margin-left: -260px; }
  .sideHead { padding: 12px; border-bottom: 1px solid var(--border); }
  .sideHead .btn { width: 100%; }
  .convList { flex: 1; overflow-y: auto; padding: 6px; }
  .convItem {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--text-dim);
  }
  .convItem:hover { background: rgba(255, 255, 255, .05); }
  .convItem.active { background: rgba(0, 167, 230, .12); color: var(--text); }
  .convItem .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convItem .rm { cursor: pointer; padding: 0 4px; font-size: 12px; color: var(--text-dim); opacity: .6; }
  .convItem .rm:hover { color: var(--danger); opacity: 1; }
  .convItem input {
    flex: 1; min-width: 0;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 13px; padding: 4px 6px; outline: none;
  }
  main { min-width: 0; }
</style>
</head>
<body>

<header>
  <button class="btn icon" id="btnSide" title="会话列表">会话</button>
  <img class="logo" src="/logo.png" alt="myrouter">
  <h1>myrouter</h1>
  <div class="spacer"></div>
  <button class="btn" id="btnAgent" title="用户画像 agent.md — AI 据此跨会话记得你">画像</button>
</header>

<div class="mid">
  <aside class="sidebar" id="sidebar">
    <div class="sideHead">
      <button class="btn primary" id="btnNew">新建对话</button>
    </div>
    <div class="convList" id="convList"></div>
  </aside>
  <main id="chat">
    <div class="msgWrap" id="wrap">
      <div class="empty">
        本地 AI 聊天 · 请求经 myrouter 转发到你的上游<br>
        Enter 发送 · Shift+Enter 换行 · 可上传文件作为附件 · AI 回复中的 JS 代码块可点击"运行"
      </div>
    </div>
  </main>
</div>

<footer>
  <div class="modelBar">
    <label for="modelSelect">模型</label>
    <select id="modelSelect" title="选择模型"></select>
    <button class="btn" id="btnReload" title="重新拉取模型列表">刷新</button>
    <span class="hint" id="modelHint"></span>
    <span class="hint" id="ctxHint"></span>
    <label class="hint toggle" title="AI 通过工具调用自动运行 JavaScript（关闭后 AI 不调用代码工具，代码块仅手动运行查看）">
      <input type="checkbox" id="chkAutoRun"> 自动运行代码
    </label>
  </div>
  <div class="composer">
    <div class="files" id="files"></div>
    <textarea id="input" rows="1" placeholder="输入消息…（Shift+Enter 换行）"></textarea>
    <div class="composerRow">
      <button class="btn" id="btnUpload" title="上传文件（图片 / 文档 / 任意类型）">附件</button>
      <input type="file" id="fileInput" multiple hidden>
      <div class="spacer"></div>
      <span class="hint" id="hint"></span>
      <button class="btn primary" id="btnSend">发送</button>
    </div>
  </div>
</footer>

<div class="overlay" id="agentOverlay" hidden>
  <div class="panel" role="dialog" aria-label="用户画像">
    <h2>用户画像 · agent.md</h2>
    <p class="desc">
      画像存放在 <code>.myrouter/agent.md</code>，每次聊天作为 system 消息注入，AI 借此跨会话记得你。<br>
      可以手写维护，也可以让 AI 根据本次对话自动提炼更新——合并现有画像与对话里新的稳定信息。
    </p>
    <textarea id="agentInput" placeholder="# 关于我&#10;写下你是谁 / 偏好 / 习惯 / 环境&#10;留空则不注入"></textarea>
    <div class="note" id="agentNote" hidden></div>
    <div class="row">
      <button class="btn" id="btnAgentGen">AI 根据对话更新</button>
      <button class="btn" id="btnAgentSave">保存</button>
      <div class="spacer"></div>
      <button class="btn" id="btnAgentClose">关闭</button>
    </div>
  </div>
</div>

<script src="/md/vendor.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const wrap = $("wrap"), input = $("input"), filesBox = $("files"), modelSelect = $("modelSelect");

let messages = [];          // OpenAI 格式消息（含多模态 content）
let attachments = [];       // { name, size, mime, dataUri }
let busy = false;
let titlePending = false;   // 新会话首轮标题总结待办（失败/中断后由下一轮补）

const settings = {
  get model() { return localStorage.getItem("mr.model") || ""; },
  set model(v) { localStorage.setItem("mr.model", v); },
};
const EMPTY_HTML = '<div class="empty">本地 AI 聊天 · 请求经 myrouter 转发到你的上游<br>' +
  "Enter 发送 · Shift+Enter 换行 · 可上传文件作为附件 · AI 回复中的 JS 代码块可点击\"运行\"</div>";
function addMsg(role, html, cls = "") {
  const empty = wrap.querySelector(".empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = `msg ${role} ${cls}`;
  const av = role === "user" ? "你" : "M";
  div.innerHTML = `<div class="avatar">${av}</div><div class="bubble">${html}</div>`;
  wrap.appendChild(div);
  scrollBottom();
  return div;
}
function userBubble(parts) {
  let html = "";
  for (const p of parts || []) {
    if (p.type === "text") html += esc(p.text);
    else if (p.type === "image_url") html += `<img src="${esc(p.image_url.url)}">`;
    else if (p.type === "file") {
      const src = p.file?.data || p.file?.url || "";
      html += src.startsWith("data:image/")
        ? `<img src="${esc(src)}">`
        : `<div style="opacity:.85">${esc(p.file?.filename || "attachment")}</div>`;
    }
  }
  return html;
}
/** 代码运行输出的系统提示气泡（居中虚线提示样式）。 */
function addSys(text) {
  addMsg("user", `<div class="sysNote">${esc(text)}</div>`, "sys");
}
let liveBubble = null;      // 当前 AI 气泡 .bubble
let thinkBox = null;        // 思维链 <details>（建立后不重建，保持用户展开状态）
let contentNode = null;     // 正文节点（单独更新）
function ensureThink() {
  if (!thinkBox) {
    thinkBox = document.createElement("details");
    thinkBox.className = "think";
    const s = document.createElement("summary");
    s.textContent = "思考过程";
    const b = document.createElement("div");
    b.className = "thinkBody";
    thinkBox.append(s, b);
    liveBubble.prepend(thinkBox);
  }
  return thinkBox;
}
/**
 * 提取正文里内嵌的思维链标签（<thinking>…</thinking> 或 <think>…</think>，
 * 允许未闭合，流式友好），返回 { text: 干净正文, thinking: 提取的思维链 }。
 * 大小写不敏感、支持多块。
 */
function splitThinking(src) {
  const OPEN_TAGS = ["<thinking>", "<think>"];
  const CLOSE_TAGS = ["</thinking>", "</think>"];
  let text = String(src ?? "");
  const lower = text.toLowerCase();
  let out = "";
  let thinking = "";
  let i = 0;
  for (let guard = 0; guard < 16; guard++) {
    let open = -1, openLen = 0;
    for (const tag of OPEN_TAGS) {
      const idx = lower.indexOf(tag, i);
      if (idx !== -1 && (open === -1 || idx < open)) { open = idx; openLen = tag.length; }
    }
    if (open === -1) { out += text.slice(i); break; }
    out += text.slice(i, open);
    let close = -1, closeLen = 0;
    for (const tag of CLOSE_TAGS) {
      const idx = lower.indexOf(tag, open + openLen);
      if (idx !== -1 && (close === -1 || idx < close)) { close = idx; closeLen = tag.length; }
    }
    if (close === -1) { // 未闭合：剩余部分视为进行中的思维链
      thinking += text.slice(open + openLen);
      break;
    }
    thinking += text.slice(open + openLen, close);
    i = close + closeLen;
  }
  return { text: out, thinking };
}
function renderContent(mdText, reasoning, withCursor) {
  const sp = splitThinking(mdText);
  const rt = (reasoning ? reasoning + "\n" : "") + sp.thinking;
  if (rt) {
    const body = ensureThink().querySelector(".thinkBody");
    body.innerHTML = mdToHtml(rt);
    renderMath(body);
  }
  if (!contentNode) {
    contentNode = document.createElement("div");
    contentNode.className = "prose";
    liveBubble.appendChild(contentNode);
  }
  contentNode.innerHTML = mdToHtml(sp.text) + (withCursor ? `<span class="cursor"></span>` : "");
  renderMath(contentNode);
  // 仅当用户已在底部附近时自动跟随流式输出（上翻历史时不打扰）
  const nearBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 120;
  if (nearBottom) liveBubble.scrollIntoView({ block: "nearest" });
  return sp.text;   // 剔除思维链后的干净正文，供写入会话历史
}
function finishStream() {
  if (contentNode) contentNode.querySelector(".cursor")?.remove();
  else if (liveBubble && !liveBubble.classList.contains("err"))
    liveBubble.innerHTML = "";   // 空回复：清掉占位，不留闪烁残留（错误气泡保留文案）
  liveBubble = null;
  thinkBox = null;
  contentNode = null;
}
function scrollBottom() { wrap.scrollIntoView({ block: "end" }); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ── Markdown 渲染（markdown-it + highlight.js 子集，tools/vendor/build.mjs 打包，零 CDN） ── */
const md = new myvendor.MarkdownIt({
  html: false,          // 原始 HTML 一律转义为文本（防注入）
  linkify: true,        // 裸 URL 自动成链接
  highlight: (code, lang) => {
    if (lang && myvendor.hljs.getLanguage(lang)) {
      try { return myvendor.hljs.highlight(code, { language: lang }).value; } catch { }
    }
    return "";          // 未知语言：走默认转义渲染
  },
});
// 链接新窗口打开 + 防反向劫持
const defaultLinkOpen = md.renderer.rules.link_open
  || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
md.renderer.rules.link_open = (tokens, idx, options, env, self) => {
  tokens[idx].attrSet("target", "_blank");
  tokens[idx].attrSet("rel", "noopener");
  return defaultLinkOpen(tokens, idx, options, env, self);
};
// JS 代码块带"运行"按钮：代码运行结果展示在块下方（代码从 DOM 读取，流式重建无副作用）
const defaultFence = md.renderer.rules.fence
  || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
md.renderer.rules.fence = (tokens, idx, options, env, self) => {
  const lang = (tokens[idx].info || "").trim().split(/\s+/)[0].toLowerCase();
  if (lang === "js" || lang === "javascript") {
    const code = tokens[idx].content;
    let highlighted;
    try { highlighted = myvendor.hljs.highlight(code, { language: "javascript" }).value; } catch { }
    // 高亮失败回退转义原文（span 不影响 DOM 读取代码文本）
    if (!highlighted) highlighted = esc(code);
    return `<div class="codeWrap"><pre><code>${highlighted}</code></pre><button class="runCode">运行</button></div>`;
  }
  return defaultFence(tokens, idx, options, env, self);
};
function mdToHtml(src) {
  return md.render(String(src ?? ""));
}
/** 渲染节点内 LaTeX（$...$ 行内 / $$...$$ 块级）：代码块（code/pre）由 ignoredTags 排除。
 *  公式错误显示原文（throwOnError: false），不影响正文。 */
function renderMath(el) {
  try {
    myvendor.renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\(", right: "\\)", display: false },
        { left: "$", right: "$", display: false },
      ],
      ignoredTags: ["code", "pre", "script", "style", "textarea"],
      throwOnError: false,
    });
  } catch { /* 数学渲染失败不影响正文 */ }
}

/** 声明的工具：AI 主动决定何时执行 JS（tool_choice auto）；非工具调用的 ```js 块只是展示/手动运行。 */
const RUN_JS_TOOL = {
  type: "function",
  function: {
    name: "run_javascript",
    description: "在浏览器沙箱执行 JavaScript 代码并返回 console.log 输出（纯计算环境：无网络、文件、DOM 访问，限时 15 秒）。用于计算、算法验证、数据处理等需要真实执行的场景。",
    parameters: {
      type: "object",
      properties: {
        code: { type: "string", description: "要执行的 JavaScript 代码" },
      },
      required: ["code"],
    },
  },
};
const MAX_TOOL_ROUNDS = 4;      // 工具循环上限，防死循环
const MAX_TOOL_OUTPUT = 4000;   // 工具输出回填上限（防 token 爆炸）

/** 流式请求 /chat 并渲染到当前 liveBubble，返回剔除思维链的干净正文。 */
async function streamChat(msgs) {
  let full = "";
  let reasoning = "";
  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: modelSelect.value || undefined,
      messages: msgs,
      tools: [RUN_JS_TOOL],                       // 声明工具：AI 可主动决定执行 JS（非所有代码块都可运行）
      tool_choice: autoRun.checked ? "auto" : "none",
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  const toolCalls = [];   // SSE 分片累积：{ id, name, arguments }（arguments 是 JSON 字符串增量拼接）
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");   // 归一 CRLF（部分上游用 \r\n\r\n 分隔 SSE 块）
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of block.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        let j;
        try { j = JSON.parse(data); } catch { continue; }
        if (j.error) throw new Error(j.error);
        const delta = j.choices?.[0]?.delta;
        if (!delta) continue;
        // 工具调用分片：index 定位、id/name 首次出现、arguments 增量拼接
        if (delta.tool_calls) {
          for (const tc of delta.tool_calls) {
            const t = toolCalls[tc.index] ??= { id: "", name: "", arguments: "" };
            if (tc.id) t.id = tc.id;
            if (tc.function?.name) t.name = tc.function.name;
            if (tc.function?.arguments) t.arguments += tc.function.arguments;
          }
        }
        // 思维链字段各家不一：DeepSeek → reasoning_content；OpenAI/OpenRouter → reasoning
        // （字符串 / {content} / Responses 形态 {summary:[{text}]} / 数组）
        const c = delta.content;
        const rc = delta.reasoning_content ?? delta.reasoning;
        let rt = "";
        if (typeof rc === "string") rt = rc;
        else if (typeof rc === "number") rt = String(rc);
        else if (Array.isArray(rc)) rt = rc.map(x => x?.text ?? "").join("");
        else if (rc) {
          if (typeof rc.content === "string") rt = rc.content;
          else if (Array.isArray(rc.summary)) rt = rc.summary.map(s => s?.text ?? "").join("");
        }
        if (c) full += c;
        if (rt) reasoning += rt;
        if (c || rt) renderContent(full, reasoning, true);
      }
    }
  }
  // 入会话历史的正文必须剔除 <thinking>，否则下一轮会把这些思维链回传给上游
  const cleanAnswer = renderContent(full, reasoning, false);
  finishStream();
  return { content: cleanAnswer, toolCalls: toolCalls.filter(t => t.id || t.name) };
}

async function send() {
  const text = input.value.trim();
  if (busy || (!text && attachments.length === 0)) return;
  busy = true;
  $("btnSend").disabled = true;
  $("hint").textContent = "生成中…";
  input.value = "";
  autoGrow();

  const parts = [];
  if (text) parts.push({ type: "text", text });
  for (const a of attachments) {
    if (a.mime.startsWith("image/")) parts.push({ type: "image_url", image_url: { url: a.dataUri } });
    else parts.push({ type: "file", file: { data: a.dataUri, filename: a.name } });
  }
  attachments = [];
  renderFiles();

  addMsg("user", userBubble(parts));
  const isFirstRound = messages.length === 0;   // 新会话首轮：整个回合完成后由 LLM 总结标题
  if (isFirstRound) titlePending = true;
  messages.push({ role: "user", content: parts });

  try {
    await runToolLoop();   // 工具循环：AI 决定调用 run_javascript → 执行回填 → 基于真实输出回答
    if (titlePending) { titlePending = false; summarizeTitle(); }   // 首轮标题总结：成功后清除待办，失败下轮补
  } catch (e) {
    if (liveBubble) {
      liveBubble.classList.add("err");
      liveBubble.textContent = "出错了：" + e.message;
    }
    finishStream();
    await convSaveCurrent();   // 失败也要落盘已收到的消息
  }
  busy = false;
  $("btnSend").disabled = false;
  $("hint").textContent = "";
}

/** 工具循环：请求 → 若 AI 发 tool_calls 则执行并回填 → 再请求，直到无工具调用（最终回答）。
 *  所有轮次复用同一个气泡：步骤块 + 最终回答合并在一次回复里，不拆成两条对话。 */
async function runToolLoop() {
  const msgEl = addMsg("ai", "");   // 整个工具循环共用一个气泡
  for (let rounds = 0; rounds < MAX_TOOL_ROUNDS; rounds++) {
    liveBubble = msgEl.querySelector(".bubble");   // 空占位：光标由 renderContent 动态追加/移除
    const { content, toolCalls } = await streamChat(trimMessages(messages, currentContextBudget()));

    if (toolCalls.length === 0) {
      if (content) messages.push({ role: "assistant", content });
      await convSaveCurrent();
      return;
    }

    // 有工具调用：assistant 消息带 tool_calls（OpenAI 格式）入库，UI 在同一气泡里追加执行步骤
    messages.push({
      role: "assistant",
      content: content || null,
      tool_calls: toolCalls.map(tc => ({ id: tc.id, type: "function", function: { name: tc.name, arguments: tc.arguments } })),
    });
    for (const tc of toolCalls) {
      const output = tc.name === "run_javascript"
        ? await runToolCall(tc, msgEl)
        : "未知工具: " + tc.name;
      messages.push({ role: "tool", tool_call_id: tc.id, content: truncateText(output) });
    }
    await convSaveCurrent();   // 工具步骤落盘，中途失败不丢
  }
  // 超出循环上限：停止并提示（历史已含全部 tool 结果，用户可继续追问）
  liveBubble = msgEl.querySelector(".bubble");
  liveBubble.classList.add("err");
  liveBubble.append("工具调用超过 " + MAX_TOOL_ROUNDS + " 轮，已停止");
  finishStream();
}

/** 执行一个工具调用：在气泡里渲染代码步骤块，沙箱运行，返回输出文本（不含耗时后缀）。 */
async function runToolCall(tc, msgEl) {
  const code = toolCallCode(tc);
  const box = document.createElement("div");
  box.className = "toolCall";
  box.innerHTML = toolCallHtml(code);
  msgEl.querySelector(".bubble").appendChild(box);
  return (await runCode(code, box)).output;
}

function truncateText(s, n = MAX_TOOL_OUTPUT) {
  s = String(s ?? "");
  return s.length > n ? s.slice(0, n) + "\n…（输出已截断）" : s;
}

const MODEL_CACHE_MS = 5 * 60 * 1000;
let modelCtx = {};   // modelId -> context_length（来自上游 /models，可能缺失）
const DEFAULT_CONTEXT = 32000;

async function loadModels(force) {
  const cached = (() => { try { return JSON.parse(localStorage.getItem("mr.models")); } catch { return null; } })();
  if (!force && cached && Date.now() - cached.ts < MODEL_CACHE_MS) { fillModels(cached.ids || [], cached.ctx || {}); return; }
  $("modelHint").textContent = "加载中…";
  try {
    const res = await fetch("/models");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    const list = (j.data || []).filter(Boolean);
    const ids = list.map(m => m.id).filter(Boolean);
    const ctx = {};
    for (const m of list)
      if (m.id && Number.isFinite(m.context_length) && m.context_length > 0) ctx[m.id] = m.context_length;
    localStorage.setItem("mr.models", JSON.stringify({ ts: Date.now(), ids, ctx }));
    fillModels(ids, ctx);
    $("modelHint").textContent = ids.length ? `共 ${ids.length} 个` : "";
  } catch {
    $("modelHint").textContent = "列表拉取失败，请检查上游配置后重试";
  }
}
function fillModels(ids, ctxMap = {}) {
  const prev = modelSelect.value;
  modelSelect.innerHTML = "";
  appendOption("", "（未选择）");
  for (const id of ids) appendOption(id, id);
  modelSelect.value = settings.model && ids.includes(settings.model) ? settings.model
    : ids.includes(prev) ? prev
    : "";
  modelCtx = ctxMap;
  updateCtxHint();
}
function appendOption(value, text) {
  const opt = document.createElement("option");
  opt.value = value;
  opt.textContent = text;
  modelSelect.appendChild(opt);
}
function updateCtxHint() {
  const id = modelSelect.value;
  const len = id && modelCtx[id];
  $("ctxHint").textContent = len ? `· 上下文 ${Math.round(len / 1000)}k` : "";
}

});

/* ── 上下文窗口：按模型 context_length 的 60% 做历史预算，超了从最旧裁剪 ── */
function currentContextBudget() {
  const id = modelSelect.value;
  const full = id && Number.isFinite(modelCtx[id]) ? modelCtx[id] : DEFAULT_CONTEXT;
  return Math.max(2048, Math.floor(full * 0.6));
}
function estTokens(s) {
  const str = String(s ?? "");
  let cjk = 0, other = 0;
  for (const ch of str) {
    if (ch.charCodeAt(0) > 0x2e80) cjk++; else other++;
  }
  return Math.ceil(cjk * 1.2 + other * 0.3);
}
function msgTokens(m) {
  let c = 0;
  const content = m && m.content;
  if (typeof content === "string") c = estTokens(content);
  else if (Array.isArray(content)) {
    for (const p of content) {
      if (!p) continue;
      if (p.type === "text") c += estTokens(p.text);
      else if (p.type === "image_url") c += 1000;               // 图片按固定粗略值
      else if (p.type === "file") c += 500;                     // 附件同样固定计费（base64 全文统计会撑爆预算）
    }
  }
  return c + 4;   // 每条消息的角色/结构开销
}
function trimMessages(list, budget) {
  if (!Array.isArray(list) || list.length <= 2) return list;
  let total = 0;
  const costs = list.map(m => { const c = msgTokens(m); total += c; return c; });
  if (total <= budget) return list;
  let drop = 0;
  while (drop < costs.length - 2 && total > budget) {   // 至少保留最近一轮
    total -= costs[drop];
    drop++;
  }
  // 工具轮完整性：保留区头部不能是孤立 tool 消息（tool 必须与所属 assistant(tool_calls) 配对，否则上游 400）——
  // 配对在丢弃区则回退整轮保留（正确性优先于预算），游离 tool 直接丢弃
  while (drop < list.length && list[drop]?.role === "tool") {
    const m = list[drop];
    let pair = -1;
    for (let p = drop - 1; p >= 0; p--) {
      const pv = list[p];
      if (pv.role === "assistant" && Array.isArray(pv.tool_calls)
        && pv.tool_calls.some(t => t.id === m.tool_call_id)) { pair = p; break; }
    }
    if (pair === -1) { total -= costs[drop]; drop++; }   // 游离 tool：丢弃
    else { drop = pair; break; }                          // 回退到所属 assistant，整轮保留
  }
  return drop === 0 ? list : list.slice(drop);
}

/** 新会话首轮：让 LLM 根据对话总结标题（覆盖自动截取的临时标题）。
 *  只发送文本消息（剥离图片/文件附件，避免 base64 大 payload 撑爆标题生成请求）。 */
async function summarizeTitle() {
  if (!activeId) return;
  const textOnly = [];
  for (const m of messages) {
    if (!m || m.content == null) continue;
    if (typeof m.content === "string") { textOnly.push(m); continue; }
    if (Array.isArray(m.content)) {
      const parts = m.content.filter(p => p && p.type === "text");
      if (parts.length > 0) textOnly.push({ role: m.role, content: parts });
    }
  }
  if (textOnly.length === 0) return;
  try {
    await fetch("/conversations/" + activeId + "/title", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: textOnly }),
    });
    convListLoad();
  } catch { /* 总结失败静默，保留自动截取的标题 */ }
}
function normParts(content) {
  if (typeof content === "string") return [{ type: "text", text: content }];
  if (Array.isArray(content)) return content;
  return [];
}
/** 从 tool_calls 里提取 run_javascript 的代码（arguments 是 {code} 的 JSON 字符串）。 */
function toolCallCode(tc) {
  const args = tc?.arguments ?? tc?.function?.arguments;
  try { return JSON.parse(args || "{}").code || ""; }
  catch { return args || ""; }
}
/** 工具步骤块 HTML：标题 + 代码 + 可选输出（实时流与历史回放共用，保证同一种样式）。 */
function toolCallHtml(code, output) {
  return `<div class="toolCall"><div class="toolTitle">运行 JavaScript</div><pre><code>${esc(code)}</code></pre>` +
    (output != null ? `<div class="codeOut">${esc(output)}</div>` : "") + "</div>";
}
function convRenderBody() {
  $("wrap").innerHTML = "";
  if (messages.length === 0) {
    $("wrap").innerHTML = EMPTY_HTML;
    return;
  }
  for (let i = 0; i < messages.length; i++) {
    const m = messages[i];
    if (m.role === "user") {
      // 自动注入的代码运行输出：渲染为居中的提示样式，而非普通用户气泡
      if (typeof m.content === "string" && m.content.startsWith("代码运行输出："))
        addSys(m.content);
      else addMsg("user", userBubble(normParts(m.content)));
    }
    else if (m.role === "assistant" && Array.isArray(m.tool_calls) && m.tool_calls.length) {
      // 工具调用轮次：连续的工具步骤（含各自输出）与随后的最终回答合并在一个气泡（与实时流一致）
      let html = "";
      while (i < messages.length && messages[i].role === "assistant"
        && Array.isArray(messages[i].tool_calls) && messages[i].tool_calls.length) {
        const cur = messages[i];
        if (cur.content) html += `<div class="prose">${mdToHtml(cur.content)}</div>`;
        const outs = {};   // tool_call_id -> 输出
        let j = i + 1;
        while (j < messages.length && messages[j].role === "tool") { outs[messages[j].tool_call_id] = messages[j].content; j++; }
        for (const c of cur.tool_calls) html += toolCallHtml(toolCallCode(c), outs[c.id]);
        i = j - 1;   // 越过已消费的 tool 消息（for 的 i++ 后指向下一条）
      }
      const next = messages[i + 1];
      if (next && next.role === "assistant" && next.content
        && !(Array.isArray(next.tool_calls) && next.tool_calls.length)) {
        html += `<div class="prose">${mdToHtml(next.content)}</div>`;
        i++;
      }
      renderMath(addMsg("ai", html));
    }
    else if (m.role === "assistant") {
      renderMath(addMsg("ai", mdToHtml(m.content || "")));
    }
    else if (m.role === "tool") {   // 游离 tool 消息（异常中断的历史）兜底
      addSys("代码运行输出：\n" + m.content);
    }
  }
  scrollBottom();
}
async function convSwitch(id) {
  if (busy) return;
  await convSaveCurrent();
  titlePending = false;   // 标题待办是当前会话的状态，切换后复位
  activeId = id;
  localStorage.setItem("mr.activeConv", id);
  try {
    const res = await fetch("/conversations/" + id);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    messages = Array.isArray(j.messages) ? j.messages : [];
  } catch { messages = []; }
  convRenderBody();
  convRender();
}
async function convNew() {
  if (busy) return;
  try {
    await convSaveCurrent();
    const res = await fetch("/conversations", { method: "POST" });
    const j = await res.json();
    activeId = j.id || "";
    titlePending = false;
    if (activeId) localStorage.setItem("mr.activeConv", activeId);
    messages = [];
    convRenderBody();
    convListLoad();
    input.focus();
  } catch { /* 新建失败静默 */ }
}
async function convDelete(id) {
  try {
    await fetch("/conversations/" + id, { method: "DELETE" });
  } catch { /* 删除失败静默 */ }
  if (id === activeId) {
    activeId = "";
    localStorage.removeItem("mr.activeConv");
    await convListLoad();
    if (conversations.length > 0) await convSwitch(conversations[0].id);
    else await convNew();
  } else {
    convListLoad();
  }
}
function convRename(id, item, titleEl) {
  const inp = document.createElement("input");
  inp.value = titleEl.textContent;
  item.replaceChild(inp, titleEl);
  inp.focus();
  const done = async () => {
    const title = inp.value.trim();
    try {
      await fetch("/conversations/" + id, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
    } catch { /* 重命名失败静默 */ }
    convListLoad();
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") done();
    else if (e.key === "Escape") convListLoad();
  });
  inp.addEventListener("blur", done);
}
async function convInit() {
  await convListLoad();   // 失败时沿用空列表，走新建兜底
  const saved = localStorage.getItem("mr.activeConv");
  if (saved && conversations.some(c => c.id === saved))
    await convSwitch(saved);
  else if (conversations.length > 0)
    await convSwitch(conversations[0].id);
  else
    await convNew();
  input.focus();
}
$("btnNew").addEventListener("click", convNew);

/* ── JS 代码运行（原生 JS + Web Worker：死循环由超时 terminate 中断） ── */
const CODE_TIMEOUT_MS = 15000;   // 超时上限：防死循环/超长执行（合法慢计算也有余量）
const autoRun = $("chkAutoRun");
autoRun.checked = localStorage.getItem("mr.autoRun") !== "0";   // 默认开
autoRun.addEventListener("change", () => localStorage.setItem("mr.autoRun", autoRun.checked ? "1" : "0"));
/** 值格式化：对象走 JSON（bigint 转字符串），循环引用/异常回退 String。 */
function fmtValue(v) {
  if (typeof v === "string") return v;
  if (typeof v === "undefined") return "undefined";
  if (typeof v === "function") return "function()";
  if (v === null) return "null";
  if (typeof v === "object") {
    try {
      const s = JSON.stringify(v, (k, x) => typeof x === "bigint" ? x.toString() : x);
      return s === undefined ? String(v) : s;
    } catch { return String(v); }
  }
  return String(v);
}
/** JS 执行核心：返回 { ok, lines } 或 { ok:false, error }。同步执行（仅供验证脚本使用；
 *  生产一律走下方 Worker 路径，防死循环卡死页面）。 */
function codeRunCore(code) {
  const saved = [console.log, console.info, console.warn, console.error];
  const lines = [];
  const push = (...args) => lines.push(args.map(fmtValue).join(" "));
  console.log = console.info = console.warn = console.error = push;
  try {
    new Function(code)();
    return { ok: true, lines };
  } catch (e) {
    return { ok: false, error: (e && e.stack) ? e.stack : String(e) };
  } finally {
    [console.log, console.info, console.warn, console.error] = saved;
  }
}
// Worker 脚本：独立线程执行 JS。沙箱移除网络/外部加载能力（纯计算）；
// console.* 劫持收集输出；主线程超时 terminate 兜底死循环。
const CODE_WORKER_CODE = [
  "self.onmessage = function(e) {",
  "  try { self.fetch = undefined; } catch (err) {}",
  "  try { self.XMLHttpRequest = undefined; } catch (err) {}",
  "  try { self.WebSocket = undefined; } catch (err) {}",
  "  try { self.importScripts = undefined; } catch (err) {}",
  "  var lines = [];",
  "  var fmt = (" + fmtValue + ");",   // 与页面 fmtValue 单一来源，避免双份格式化逻辑漂移
  "  function push() {",
  "    var parts = [];",
  "    for (var i = 0; i < arguments.length; i++) parts.push(fmt(arguments[i]));",
  "    lines.push(parts.join(' '));",
  "  }",
  "  console.log = console.info = console.warn = console.error = push;",
  "  try {",
  "    new Function(e.data.code)();",
  "    self.postMessage({ ok: true, lines: lines });",
  "  } catch (err) {",
  "    self.postMessage({ ok: false, error: (err && err.stack) ? err.stack : String(err) });",
  "  }",
  "};",
].join("\n");
function runCode(code, container) {
  return new Promise(resolve => {
    container.querySelector(".codeOut")?.remove();
    const out = document.createElement("div");
    out.className = "codeOut";
    container.appendChild(out);
    const t0 = performance.now();
    // 每次执行独立 Worker、用完即终止：用户代码无法通过篡改 onmessage 污染后续执行
    const worker = new Worker(URL.createObjectURL(new Blob([CODE_WORKER_CODE], { type: "text/javascript" })));
    const finish = (result) => {
      const text = result.ok
        ? (result.lines.length ? result.lines.join("\n") : "(无输出)")
        : "错误: " + (result.error || "未知错误");
      out.textContent = text + "\n耗时 " + (performance.now() - t0).toFixed(0) + " ms";
      out.classList.add(result.ok ? "ok" : "err");
      resolve({ text: out.textContent, output: text });   // output：纯结果（回填工具消息用，不含耗时）
    };
    const timer = setTimeout(() => {   // 死循环/超长：终止 worker 强制中断
      try { worker.terminate(); } catch { }
      finish({ ok: false, error: "执行超时（超过 " + CODE_TIMEOUT_MS / 1000 + " 秒），已终止" });
    }, CODE_TIMEOUT_MS);
    worker.onmessage = e => { clearTimeout(timer); finish(e.data); };
    worker.onerror = () => { clearTimeout(timer); finish({ ok: false, error: "Worker 异常" }); };
    worker.postMessage({ code });
  });
}
wrap.addEventListener("click", e => {
  const btn = e.target.closest?.(".runCode");
  if (!btn || busy || btn.disabled) return;
  const w = btn.closest(".codeWrap");
  btn.disabled = true;
  btn.textContent = "运行中…";
  runCode(w.querySelector("pre code").textContent, w).then(() => {
    btn.disabled = false;
    btn.textContent = "重新运行";
  });
});

$("btnSide").addEventListener("click", () => {
  $("sidebar").classList.toggle("collapsed");
});
// 刷新/关闭页面兜底：sendBeacon 把未保存的当前会话发走（await 保存后此路极少触发）
if (typeof window !== "undefined")
  window.addEventListener("beforeunload", () => {
    if (activeId && messages.length > 0)
      navigator.sendBeacon?.("/conversations/" + activeId,
        new Blob([JSON.stringify({ messages })], { type: "application/json" }));
  });

convInit();
</script>
